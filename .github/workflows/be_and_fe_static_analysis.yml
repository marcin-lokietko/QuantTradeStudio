name: BE and FE static analysis

on:
  push:
    branches:
      - main
      - backtesting
  pull_request:
    branches:
      - main

jobs:
  be-and-fe-static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker images
        run: |
          for i in {1..5}; do
            ./scripts/build_docker_images.sh && break
            echo "Build failed (attempt $i), retrying..."
            sleep 5
          done

      - name: Run backend clang format check
        run: ./scripts/run_formatter_in_docker.sh validate

      - name: Run frontend prettier format check
        run: ./scripts/run_frontend_format_check_in_docker.sh

      - name: Create artifacts
        run: |
          mkdir -p artifacts
          zip -r artifacts/logs.zip ./logs
        if: always()

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logs-archive
          path: artifacts/logs.zip
        if: always()
