<div>
  <mat-spinner *ngIf="isLoading" class="spinner" color="accent" diameter="50"></mat-spinner>
  <table *ngIf="!isLoading" mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    <ng-container matColumnDef="assetPair">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Asset Pair</th>
      <td mat-cell *matCellDef="let element">{{ element.assetPair }}</td>
    </ng-container>

    <ng-container matColumnDef="orderSide">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Order Side</th>
      <td mat-cell *matCellDef="let element">{{ element.orderSide }}</td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
      <td mat-cell *matCellDef="let element">{{ element.price }}</td>
    </ng-container>

    <ng-container matColumnDef="origQuantity">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Orig Quantity</th>
      <td mat-cell *matCellDef="let element">{{ element.origQuantity }}</td>
    </ng-container>

    <ng-container matColumnDef="executedQuantity">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Executed Quantity</th>
      <td mat-cell *matCellDef="let element">{{ element.executedQuantity }}</td>
    </ng-container>

    <!-- first row -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
